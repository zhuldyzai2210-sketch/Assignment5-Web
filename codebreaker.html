
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Breaker | Secret Code</title>
  <link rel="stylesheet" href="style.css">
  <script src="task1.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="header">
      <span class="eyebrow">THE SECRET CODE CHALLENGE</span>
      <h1>🔐 Code Breaker</h1>
      <p>Crack the secret code in <span id="max-attempts"></span> attempts!</p>
    </header>

    <section class="stats">
      <div class="stat">
        <span>Attempts Left</span>
        <strong id="attempts">8</strong>
      </div>
      <div class="stat">
        <span>Code Length</span>
        <strong id="code-length">4</strong>
      </div>
    </section>

    <section class="secret-section">
      <h2>Secret Code</h2>
      <div id="secret-display" class="secret-display">
        <span>?</span>
        <span>?</span>
        <span>?</span>
        <span>?</span>
      </div>
    </section>

    <form id="guess-form" novalidate>
      <label for="guess">Enter your guess</label>
      <input
        type="text"
        id="guess"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
        placeholder="e.g. 1234"
      >
      <button id="check-btn" type="submit">
        Check Code
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <section class="history-section">
      <h2>Guess History</h2>
      <div id="history" class="history"></div>
    </section>

    <button id="restart-btn" class="restart">
      ↻ New Game
    </button>
  </main>
</body>
</html>
